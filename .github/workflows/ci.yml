name: Candidate verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642e1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Materialize a clean candidate with immutable portfolio evidence
        run: scripts/prepare-release-candidate.sh "$RUNNER_TEMP/portfolio-candidate"
      - name: Install exact candidate toolchains
        working-directory: ${{ runner.temp }}/portfolio-candidate
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.lock
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify the same candidate command used for release
        working-directory: ${{ runner.temp }}/portfolio-candidate
        run: npm run verify:release -- --stage candidate
      - name: Build and scan the immutable candidate runtime image
        working-directory: ${{ runner.temp }}/portfolio-candidate
        run: npm run security:scan-runtime
