name: CI

on:
  pull_request:
  push:
    branches: [main, traffic-lab]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Engine tests
        run: npm run test:engine
      - run: npm run build
      - name: Visitor flow (Playwright + axe)
        run: |
          npx playwright install --with-deps chromium
          npm run start -- -p 3100 &
          npx --yes wait-on http://localhost:3100 --timeout 60000
          BASE_URL=http://localhost:3100 node tests/e2e/visitor-flow.mjs

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Regenerate the Abay dossier evidence pack used by the legacy tests
        run: PYTHONPATH=src python scripts/bootstrap_portfolio.py
      - name: Data rebuild and Python tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
