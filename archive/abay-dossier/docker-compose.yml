services:
  app:
    build:
      context: .
      args:
        SOURCE_DATE_EPOCH: "0"
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
